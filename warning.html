<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警告信息</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        
        .container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        
        .warning-icon {
            font-size: 40px;
            color: #ff4d4d;
            margin-bottom: 15px;
            animation: pulse 1s infinite;
        }
        
        .warning-text {
            font-size: 18px;
            line-height: 1.5;
            color: #333;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="warning-icon">⚠️</div>
        <div class="warning-text">
            <strong>聚会警示！</strong><br>
            提供"快乐水"的陌生聚会<br>
            <strong>※涉毒风险预警※</strong><br>
        </div>
    </div>
</body>
</html>
